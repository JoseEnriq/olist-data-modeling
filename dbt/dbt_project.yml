name: olist
version: "1.0.0"
profile: olist

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  # Range of dim_date: whole years covering every purchase, milestone and review.
  dim_date_start: "2016-01-01"
  dim_date_end: "2018-12-31"
  # Bounding box of Brazil, used to spot geolocation points that are clearly wrong.
  brazil_min_latitude: -33.75
  brazil_max_latitude: 5.27
  brazil_min_longitude: -73.99
  brazil_max_longitude: -34.79

clean-targets:
  - target
  - dbt_packages

models:
  olist:
    # Staging is a thin, typed layer over the raw files: cheap to rebuild as views.
    staging:
      +materialized: view
    # Intermediate steps feed the marts; nobody queries them directly.
    intermediate:
      +materialized: view
    # Marts are what people query, so they are stored as tables.
    marts:
      +materialized: table
